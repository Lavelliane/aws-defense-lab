name: Deploy Lab
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Application and IAM mode
        type: choice
        options: [vulnerable, hardened]
        default: vulnerable

permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-defense-lab
  cancel-in-progress: false
env:
  CHECKPOINT_DISABLE: '1'
  TF_IN_AUTOMATION: 'true'
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_lab_name: ${{ vars.LAB_NAME }}
  TF_VAR_allowed_cidr: ${{ vars.ALLOWED_CIDR }}
  TF_VAR_permissions_boundary_arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TF_VAR_app_mode: ${{ inputs.mode }}
    steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Check configuration
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: python3 scripts/check_workflow_config.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: defense-lab-${{ github.run_id }}
      - name: Install operation dependencies
        run: python3 -m pip install -r app/requirements.txt
      - name: Build runtime bundle
        run: python3 scripts/build_bundle.py
      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=lab/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate and apply
        run: |
          terraform -chdir=terraform validate
          terraform -chdir=terraform plan -input=false -lock-timeout=5m -out=deploy.tfplan
          terraform -chdir=terraform apply -input=false -lock-timeout=5m deploy.tfplan
      - name: Verify service readiness
        run: python3 scripts/operations.py ready
      - name: Print access instructions
        run: |
          terraform -chdir=terraform output app_url
          terraform -chdir=terraform output dashboard_url
          echo 'Retrieve the dashboard password through an interactive SSM session. See docs/operations.md.'
      - name: Remove local plan
        if: always()
        run: rm -f terraform/deploy.tfplan
