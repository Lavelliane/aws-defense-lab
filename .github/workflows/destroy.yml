name: Destroy Lab
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type the configured lab name
        type: string
        required: true
      purge:
        description: Type PURGE to delete all dummy data, audit logs and artifact versions
        type: string
        required: true

permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-defense-lab
  cancel-in-progress: false
env:
  CHECKPOINT_DISABLE: '1'
  TF_IN_AUTOMATION: 'true'
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_lab_name: ${{ vars.LAB_NAME }}
  TF_VAR_allowed_cidr: ${{ vars.ALLOWED_CIDR }}
  TF_VAR_permissions_boundary_arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Check configuration
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: python3 scripts/check_workflow_config.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: defense-lab-${{ github.run_id }}
      - name: Install operation dependencies
        run: python3 -m pip install -r app/requirements.txt
      - name: Build runtime bundle
        run: python3 scripts/build_bundle.py
      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=lab/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Confirm teardown and enable bucket cleanup
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PURGE: ${{ inputs.purge }}
        run: |
          test "$CONFIRMATION" = "$TF_VAR_lab_name"
          test "$PURGE" = 'PURGE'
          # Target ONLY bucket resources to record force_destroy without rebuilding hosts.
          terraform -chdir=terraform plan -input=false -lock-timeout=5m \
            -target=aws_s3_bucket.lab -var='purge_on_destroy=true' -out=purge.tfplan
          terraform -chdir=terraform apply -input=false -lock-timeout=5m purge.tfplan
      - name: Destroy lab resources
        run: terraform -chdir=terraform destroy -input=false -auto-approve -lock-timeout=5m -var='purge_on_destroy=true'
      - name: Remove local plan
        if: always()
        run: rm -f terraform/purge.tfplan
